name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v1.16.5'
        required: true

permissions:
  contents: write  # needed to create the GitHub Release and upload assets

jobs:
  build:
    name: Build & sign macOS app
    runs-on: macos-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so `git log <prev-tag>..<tag>` works in the
          # release-notes step. Default shallow clone would miss it.
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install Python deps
        # `dmgbuild` builds the .dmg; `cryptography` derives the Sparkle
        # public key from the private key for the pre-sign sanity check
        # in `build-zip-and-appcast.sh`.
        run: pip3 install --break-system-packages dmgbuild cryptography

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up signing keychain
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: ./ci/setup-keychain.sh

      - name: Archive
        run: ./ci/archive.sh

      - name: Export archive
        run: ./ci/export.sh

      # - name: Check build number was bumped
      #   run: ./ci/check-build-bump.sh

      - name: Verify signing
        run: ./ci/verify-signing.sh

      - name: Notarize app
        env:
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
        run: ./ci/notarize.sh

      - name: Build & notarize DMG
        env:
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
        run: ./ci/build-dmg.sh

      - name: Install Sparkle
        run: ./ci/install-sparkle.sh

      - name: Verify Sparkle key pair
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./ci/verify-sparkle-key.sh

      - name: Build Sparkle zip & appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./ci/build-zip-and-appcast.sh

      - name: Publish to Scaleway
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: ./ci/upload-release.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lalfred-release
          path: |
            build/LAlfred-*.dmg
            build/LAlfred-*.zip
            build/appcast.xml

      - name: Generate release notes
        id: notes
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          NOTE="$(./ci/generate-release-notes.sh "${{ steps.tag.outputs.tag }}")"
          {
            echo "note<<RELEASE_NOTE_EOF"
            echo "${NOTE}"
            echo "RELEASE_NOTE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release
        # Idempotent: if the release already exists (e.g. re-running via
        # workflow_dispatch after a botched build) we re-upload the assets
        # rather than failing. Body is only set on initial creation.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTE: ${{ steps.notes.outputs.note }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "==> Release ${TAG} already exists; re-uploading assets."
            gh release upload "${TAG}" \
              build/LAlfred-*.dmg \
              build/LAlfred-*.zip \
              build/appcast.xml \
              --clobber
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes "${NOTE}" \
              build/LAlfred-*.dmg \
              build/LAlfred-*.zip \
              build/appcast.xml
          fi

      - name: Tear down signing keychain
        # `if: always()` so the keychain is removed even if an earlier
        # step failed. Idempotent — safe even if `setup-keychain.sh`
        # never ran.
        if: always()
        run: ./ci/teardown-keychain.sh
