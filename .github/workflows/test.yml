name: Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  test:
    name: Unit tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run unit tests
        run: ./ci/test.sh
